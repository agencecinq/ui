name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or later: pnpm 10 publishes through npm.
      - run: npm install --global npm@11

      - run: pnpm install --frozen-lockfile

      # changesets/action@v2 requires the Changesets CLI v3: the repository is on v2.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: ":bookmark: Version packages"
          title: ":bookmark: Version packages"
